<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04112A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Irish Analytics 2026 · Notre Dame Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☘️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy0:#030D20;--navy1:#04112A;--navy2:#08203F;
  --gold:#C99700;--gold2:#EBCB6E;--green:#3CCB8A;--green2:#1E8F5C;--violet:#9B8BDA;--red:#E06C6C;
  --ink:#EAF0F8;--ink2:#C9D6E8;--mute:#8FA4C2;--slate:#7F95B6;--line:rgba(201,151,0,.28);--hair:rgba(143,164,194,.14);
  --disp:"Chakra Petch",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{
  background:radial-gradient(110% 60% at 95% -10%,rgba(201,151,0,.18),transparent 55%),radial-gradient(80% 50% at -10% 105%,rgba(0,132,61,.14),transparent 60%),linear-gradient(180deg,var(--navy2),var(--navy0));
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(143,164,194,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(143,164,194,.06) 1px,transparent 1px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin-inline:auto;padding:0 clamp(.8rem,3vw,1.6rem) 2.5rem}

/* header */
.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(3,13,32,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin-inline:auto;padding:.5rem clamp(.8rem,3vw,1.6rem);display:flex;align-items:center;gap:.8rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--disp);font-weight:600;font-size:1.02rem;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:28px;height:28px;filter:drop-shadow(0 0 8px rgba(235,203,110,.35))}
.brand .y{color:var(--gold2)}
.status{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--slate);flex:none}
.dot.live{background:var(--red);animation:pulse 1.6s infinite}
.dot.ok{background:var(--green)}.dot.warn{background:var(--gold2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,108,108,.6)}70%{box-shadow:0 0 0 8px rgba(224,108,108,0)}100%{box-shadow:0 0 0 0 rgba(224,108,108,0)}}
.nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin-inline:auto;padding:0 clamp(.8rem,3vw,1.6rem) .45rem}
.nav::-webkit-scrollbar{display:none}
.nav button{appearance:none;border:1px solid transparent;background:none;color:var(--mute);font:500 .86rem var(--disp);letter-spacing:.03em;padding:.38rem .75rem;cursor:pointer;white-space:nowrap}
.nav button[aria-selected=true]{color:var(--navy1);background:var(--gold2)}
.nav button .ld{display:inline-block;width:.4rem;height:.4rem;border-radius:50%;background:var(--red);margin-left:.35rem;vertical-align:middle}
.ticker{border-top:1px solid var(--hair);overflow:hidden;white-space:nowrap;font-size:.74rem;color:var(--ink2);height:1.6rem;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .tk{display:inline-flex;gap:2.2rem;padding-left:2.2rem}
.ticker .tk span b{color:var(--gold2);font-weight:600;margin-left:.3rem}
@media (prefers-reduced-motion:no-preference){.ticker .run{animation:tick 55s linear infinite}.ticker:hover .run{animation-play-state:paused}@keyframes tick{to{transform:translateX(-50%)}}}

h1{font-family:var(--disp);font-weight:500;font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.08;margin:1.3rem 0 .35rem;letter-spacing:.005em}
h1 .y{color:var(--gold2)}
.take{color:var(--ink2);max-width:68ch;margin:0 0 1.2rem}
.take b{color:var(--gold2);font-weight:600}
h2{font-family:var(--disp);font-weight:500;font-size:1.08rem;margin:0;letter-spacing:.02em}
.note{color:var(--mute);font-size:.8rem;margin:.25rem 0 .8rem;max-width:78ch}
.banner{border:1px solid rgba(235,203,110,.5);background:rgba(201,151,0,.12);color:var(--ink2);padding:.6rem .8rem;font-size:.85rem;margin:1rem 0 0}
.banner b{color:var(--gold2)}

.pn{position:relative;background:linear-gradient(180deg,rgba(19,58,110,.55),rgba(9,33,66,.6));border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));padding:1rem 1.1rem;margin-bottom:1rem}
.pn::after{content:"";position:absolute;left:0;top:0;width:34px;height:2px;background:var(--gold)}
.pn.hero{background:linear-gradient(180deg,rgba(26,70,130,.6),rgba(9,33,66,.7))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:0 1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.6rem),1fr));gap:.65rem;margin-bottom:1rem}
.kpis .pn{margin:0;padding:.85rem 1rem}
.k .lb{font-size:.76rem;color:var(--mute)}
.k .v{font-family:var(--disp);font-size:clamp(1.6rem,4.5vw,2.15rem);font-weight:500;color:var(--gold2);line-height:1.15;margin:.15rem 0}
.k .s{font-size:.76rem;color:var(--mute)}
.k .s b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;margin-bottom:.4rem}

.tabs{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.7rem}
.tb{appearance:none;font:500 .76rem var(--body);color:var(--mute);background:rgba(4,17,42,.6);border:1px solid rgba(143,164,194,.25);padding:.3rem .6rem;cursor:pointer}
.tb[aria-pressed=true]{color:var(--navy1);background:var(--gold2);border-color:var(--gold2)}
.tb:focus-visible,.nav button:focus-visible,.g:focus-visible,.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn{appearance:none;font:500 .8rem var(--body);color:var(--ink);background:rgba(201,151,0,.16);border:1px solid var(--line);padding:.4rem .75rem;cursor:pointer}
.btn.on{background:var(--gold2);color:var(--navy1);border-color:var(--gold2)}
.tog{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--ink2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--gold)}

/* season strip */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:.45rem}
.g{appearance:none;font:inherit;color:inherit;text-align:left;border:1px solid rgba(143,164,194,.18);background:rgba(4,17,42,.55);padding:.45rem .5rem .5rem;min-height:5.1rem;display:flex;flex-direction:column;gap:.1rem;cursor:pointer}
.g.fin{border-color:rgba(201,151,0,.35)}
.g.sel{border-color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold2),0 0 16px rgba(235,203,110,.22)}
.g.lv{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.g.nx{border-style:dashed;border-color:rgba(60,203,138,.6)}
.g .o{display:flex;align-items:center;gap:.3rem;font-weight:600;font-size:.88rem}
.g .o img{width:18px;height:18px;object-fit:contain}
.g .w{font-size:.78rem;color:var(--green);font-weight:600}
.g .w.l{color:var(--violet)}.g .w.lv{color:var(--red)}
.g .d{font-size:.72rem;color:var(--mute)}
.g .mb{margin-top:auto;height:3px;background:rgba(143,164,194,.15)}
.g .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
@media (prefers-reduced-motion:no-preference){.strip.anim .g{animation:fin .5s cubic-bezier(.2,.7,.2,1) both}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;text-align:center}
.score .tm{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.score .tm img{width:52px;height:52px;object-fit:contain}
.score .tm .nm{font-weight:600;font-size:.9rem}
.score .rk{font-size:.72rem;color:var(--mute)}
.score .pts{font-family:var(--disp);font-size:clamp(2.4rem,9vw,3.6rem);font-weight:600;line-height:1;color:var(--ink)}
.score .pts.nd{color:var(--gold2);text-shadow:0 0 18px rgba(235,203,110,.35)}
.score .mid{font-family:var(--disp);color:var(--mute);font-size:.85rem}
.score .mid .clk{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.15rem}
.poss{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--gold2);margin-left:.3rem;vertical-align:middle;box-shadow:0 0 8px var(--gold2)}
.sit{margin-top:.8rem;text-align:center;font-size:.92rem;color:var(--ink2)}
.sit b{color:var(--gold2);font-family:var(--disp);font-weight:600;letter-spacing:.02em}
.lastplay{margin-top:.35rem;font-size:.82rem;color:var(--mute);text-align:center;max-width:70ch;margin-inline:auto}

/* field */
.field{margin-top:.9rem}
@media (prefers-reduced-motion:no-preference){.ballg{animation:roll 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes roll{from{transform:translateX(var(--dx))}to{transform:translateX(0)}}
 .ltg{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}}

.cmp{width:100%;border-collapse:collapse;font-size:.85rem}
.cmp td{padding:.35rem .4rem;border-bottom:1px solid var(--hair)}
.cmp td:nth-child(2){text-align:center;color:var(--mute);font-size:.76rem}
.cmp td:first-child{text-align:right;color:var(--gold2);font-weight:600;width:38%}
.cmp td:last-child{text-align:left;color:var(--ink2);font-weight:600;width:38%}
.feed{list-style:none;margin:0;padding:0;font-size:.82rem}
.feed li{display:grid;grid-template-columns:3.6rem 1fr auto;gap:.5rem;padding:.42rem 0;border-bottom:1px solid var(--hair);align-items:start}
.feed .t{color:var(--mute);font-size:.72rem}
.feed .e{font-weight:600;font-size:.76rem;padding:.05rem .35rem;white-space:nowrap}
.feed li.op .x{color:var(--ink2)}
.feed li.scr .x{color:var(--gold2);font-weight:600}
.cd{font-family:var(--disp);font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold2);letter-spacing:.02em}

/* insights */
.ins{list-style:none;margin:.4rem 0 0;padding:0;display:grid;gap:.55rem}
.ins li{position:relative;padding-left:1.1rem;color:var(--ink2);font-size:.9rem;max-width:80ch}
.ins li::before{content:"";position:absolute;left:0;top:.55em;width:.45rem;height:.45rem;transform:rotate(45deg);background:var(--gold)}
.ins li.bad::before{background:var(--violet)}
.ins li.good::before{background:var(--green)}
.ins b{color:var(--ink);font-weight:600}

/* charts */
.cb{position:relative;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--body);font-size:11px;fill:var(--mute)}
svg .lbl{font-weight:600}
svg .big{font-family:var(--disp);font-size:15px;font-weight:600;fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:#0A2346;border:1px solid var(--line);padding:.35rem .55rem;font-size:.76rem;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:3;max-width:90vw;white-space:normal;width:max-content}
.tip .h{color:var(--mute);margin-bottom:.1rem}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-size:.76rem;color:var(--mute);margin-top:.35rem}
.legend i{display:inline-block;width:.8rem;height:.55rem;vertical-align:middle;margin-right:.35rem}
.keys{list-style:none;margin:0;padding:0;font-size:.82rem}
.keys li{display:grid;grid-template-columns:4rem 1fr;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--hair)}
.keys .w{font-family:var(--disp);font-weight:600;font-size:.95rem;text-align:right}
.keys .m{color:var(--mute);font-size:.72rem;display:block}

/* heat grid */
.hg{display:grid;grid-template-columns:4.2rem repeat(4,1fr);gap:3px;font-size:.78rem}
.hg div{padding:.45rem .3rem;text-align:center;background:rgba(4,17,42,.55)}
.hg .hd{background:none;color:var(--mute);font-size:.72rem}
.hg .c b{display:block;font-family:var(--disp);font-size:1rem;color:var(--ink)}
.hg .c span{color:var(--ink2);font-size:.7rem}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
.t th{font-weight:500;color:var(--mute);text-align:right;padding:.42rem .45rem;border-bottom:1px solid var(--line);white-space:nowrap;background:#0B2547}
.t th:first-child,.t td:first-child{text-align:left;position:sticky;left:0;background:#0B2547;z-index:1}
.t td{padding:.36rem .45rem;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
.t td:first-child{color:var(--ink);font-size:.86rem}
.t tr.gs td{border-top:1px solid rgba(201,151,0,.38)}
.t .grp{display:block;color:var(--gold2);font-size:.7rem;font-family:var(--disp);letter-spacing:.03em}
.t .bs{color:var(--mute);text-align:left}
.ub{position:relative;min-width:6.5rem;height:1.2rem;background:rgba(143,164,194,.12)}
.ub i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--green2),var(--green))}
.ub span{position:absolute;left:.35rem;top:50%;transform:translateY(-50%);color:var(--ink);font-size:.76rem}
.rb{display:flex;align-items:center;gap:.35rem;justify-content:flex-end}
.rb .tr{position:relative;width:3.8rem;height:.8rem}
.rb .tr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(143,164,194,.35)}
.rb .tr i{position:absolute;top:0;bottom:0}
td.pf{font-weight:600}
.scroll{max-height:32rem;overflow:auto}
.empty{color:var(--mute);font-size:.85rem;padding:1rem 0;text-align:center}
.method{font-size:.82rem;color:var(--ink2);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.6rem 1.4rem}
.method p{margin:0}
.method b{color:var(--gold2);font-weight:600}
.log{font-size:.74rem;color:var(--mute);max-height:12rem;overflow:auto;margin-top:.5rem}
.log div{padding:.15rem 0;border-bottom:1px solid var(--hair);word-break:break-all}
.log .okc{color:var(--green)}.log .bad{color:var(--red)}
.foot{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--mute)}

/* score alert */
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(60% 50% at 50% 40%,rgba(235,203,110,.55),rgba(201,151,0,.15) 60%,transparent);opacity:0}
.flash.go{animation:flash 1.8s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translate(-50%,-20px);z-index:51;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,#123D74,#0A2346);border:1px solid var(--gold2);padding:.8rem 1.4rem;text-align:center;min-width:16rem;box-shadow:0 0 40px rgba(235,203,110,.35);transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .a{font-family:var(--disp);font-weight:700;font-size:1.5rem;color:var(--gold2);letter-spacing:.03em}
.toast.op{border-color:var(--slate);box-shadow:none}.toast.op .a{color:var(--ink2);font-size:1.15rem}
.toast .b{font-size:.9rem;color:var(--ink2);margin-top:.15rem}
[hidden]{display:none!important}
@media (max-width:640px){.hide-n{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DE8F"/><stop offset="1" stop-color="#B8890A"/></linearGradient></defs>
        <path d="M32 4V13" stroke="url(#dg)" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="15" r="2.4" fill="url(#dg)"/>
        <path d="M14 42C14 27 22 18 32 18S50 27 50 42Z" fill="url(#dg)"/><rect x="11" y="42" width="42" height="5" fill="url(#dg)"/>
        <path d="M13 47h38v9H13zM19 47v9M25 47v9M32 47v9M39 47v9M45 47v9" fill="none" stroke="url(#dg)" stroke-width="1.5"/></svg>
      <span>Irish Analytics <span class="y">2026</span></span>
    </div>
    <div class="status"><span class="dot" id="sdot"></span><span id="stext">Connecting</span></div>
  </div>
  <nav class="nav" role="tablist" id="nav"></nav>
  <div class="ticker" id="ticker" aria-hidden="true"></div>
</header>

<main class="wrap" id="app"></main>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" aria-live="assertive"><div class="a" id="toastA"></div><div class="b" id="toastB"></div></div>

<script>
/* =========================================================================
   Irish Analytics 2026 — Notre Dame command center
   Data: ESPN public site API (no key, fetched from the browser).
   Falls back to a baked Oct 9 2026 box-score snapshot if ESPN is unreachable.
   ========================================================================= */
const CFG = {
  teamId: '87',
  season: 2026,
  base: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football',
  livePollMs: 15000,
  nearPollMs: 60000,
  idlePollMs: 600000,
  cacheVer: 'nd26-v2'
};

const SNAPSHOT = {
  asOf: '2026-10-09',
  games: [
    ['2026-09-06T23:30:00Z','Wisconsin','WIS',true,41,13,350,61,0,284,61,2],
    ['2026-09-12T19:30:00Z','Rice','RICE',true,52,0,478,65,0,128,46,4],
    ['2026-09-19T23:30:00Z','Michigan State','MSU',true,27,10,395,67,0,167,45,2],
    ['2026-09-26T18:00:00Z','Purdue','PUR',false,49,10,444,58,1,218,68,1],
    ['2026-10-03T16:00:00Z','North Carolina','UNC',false,37,26,475,74,0,285,51,2],
    ['2026-10-10T19:30:00Z','Stanford','STAN',true],
    ['2026-10-17T23:30:00Z','BYU','BYU',false],
    ['2026-10-31T16:00:00Z','Navy','NAVY',false],
    ['2026-11-08T00:30:00Z','Miami','MIA',true],
    ['2026-11-14T20:30:00Z','Boston College','BC',true],
    ['2026-11-22T00:30:00Z','SMU','SMU',true],
    ['2026-11-28T18:00:00Z','Syracuse','SYR',false]
  ]
};

const S = {
  games: [], models: {}, source: 'init', tab: 'live', scope: 'S', metric: 'sr', gcGame: null,
  playerTab: 'passing', noGarbage: false, side: 'nd', log: [], updated: null, oppInfo: {}, timer: null, animated: false,
  prevBall: null, alerts: false, lastScores: {}
};
try { S.alerts = localStorage.getItem('nd26-alerts') === '1'; } catch (e) {}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v == null || v === '' || v === '--') return null; const n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; };
const ok = v => v != null && !isNaN(v) && isFinite(v);
const F = {
  pct: v => ok(v) ? (v * 100).toFixed(1) + '%' : '—',
  pct0: v => ok(v) ? Math.round(v * 100) + '%' : '—',
  f1: v => ok(v) ? v.toFixed(1) : '—',
  f2: v => ok(v) ? v.toFixed(2) : '—',

/* ---------- expected points (simple model) ---------- */
function EP(down, dist, ytg) {
  if (ytg <= 0) return 7;
  if (ytg >= 100) return -2;
  let ep = -0.6 + 0.062 * (100 - ytg);
  ep -= [0, 0, 0.3, 0.85, 1.5][down] || 0;
  ep -= 0.035 * Math.max(0, Math.min(dist, 25) - 10) * (down > 1 ? 1.4 : 1);
  return ep;
}
function epaOf(p) {
  const s = EP(p.down, p.dist, p.ytg);
  if (p.defTD) return -7 - s;
  if (p.to) { const spot = Math.max(1, Math.min(99, p.ytg - p.yds)); return -EP(1, 10, 100 - spot) - s; }
  if (p.td) return 7 - s;
  const ny = p.ytg - p.yds;
  if (ny <= 0) return 7 - s;
  if (ny >= 100) return -2 - s;
  if (p.yds >= p.dist) return EP(1, Math.min(10, ny), ny) - s;
  if (p.down === 4) return -EP(1, 10, 100 - ny) - s;
  return EP(p.down + 1, p.dist - p.yds, ny) - s;
}
function successOf(p) {
  if (p.td) return 1;
  if (p.to) return 0;
  if (p.down === 1) return p.yds >= 0.5 * p.dist ? 1 : 0;
  if (p.down === 2) return p.yds >= 0.7 * p.dist ? 1 : 0;
  return p.yds >= p.dist ? 1 : 0;
}

function feat(p, side, ndMargin) {
  const t = ((p.type && p.type.text) || '').toLowerCase();
  const raw = String(p.text || '');
  const txt = raw.replace(/^\([^)]*\)\s*/, '');
  const s = p.start || {};
  const down = num(s.down), dist = num(s.distance), ytg = num(s.yardsToEndzone);
  if (!down || down < 1 || down > 4 || ytg == null || dist == null) return null;
  if (/two-point|conversion/.test(t) || /two-point/i.test(raw)) return null;
  if (/no play/i.test(raw)) return null;
  let kind = null;
  if (/sack/.test(t) || /\bsacked\b/i.test(raw)) kind = 'sack';
  else if (/pass|interception/.test(t)) kind = 'pass';
  else if (/rush/.test(t)) kind = 'rush';
  else if (/fumble/.test(t)) kind = /\bpass\b|steps back/i.test(raw) ? 'pass' : 'rush';
  else return null;
  const yds = num(p.statYardage) || 0;
  const to = /interception|fumble recovery \(opponent\)|fumble return touchdown/.test(t);
  const defTD = to && /touchdown/.test(t);
  const td = !to && (/touchdown/.test(t) || (!!p.scoringPlay && /touchdown/i.test(raw)));
  const f = { id: String(p.id || ''), off: side, q: num(p.period && p.period.number) || 0, clock: (p.clock && p.clock.displayValue) || '', down, dist, ytg, yds, kind, td, to, defTD };
  if (kind === 'pass') {
    const m = txt.match(/pass\s+(?:complete|incomplete|intercepted)?\s*(short|deep)?\s*(left|middle|right)?/i);
    const dir = m && m[2] ? m[2].toLowerCase() : null;
    f.dir = dir;
    f.depth = /\bdeep\b/i.test(txt) ? 'deep' : (dir || /\bshort\b/i.test(txt) ? 'short' : null);
    const pm = txt.match(/^(.+?)\s+(?:pass|steps back)/i); if (pm) f.passer = pm[1].trim();
    const tm = raw.match(/(?:Catch made by|intended for|incomplete to|complete to)\s+([A-Z][\w.'-]+(?:\s[A-Z][a-z][\w'-]+)?)/);
    if (tm) f.target = tm[1].replace(/\.$/, '');
  }
  if (kind === 'sack') { const pm = txt.match(/^(.+?)\s+(?:pass|steps back|sacked)/i); if (pm) f.passer = pm[1].trim(); }
  if (kind === 'rush') {
    const rm = txt.match(/^(.+?)\s+(?:rushed|run|scrambles|rush)/i); if (rm) f.runner = rm[1].trim();
    const gm = txt.match(/\b(left|right)\s+(end|tackle|guard)\b/i);
    if (gm) f.gap7 = (gm[1][0] + gm[2][0]).toUpperCase();
    else if (/up the middle|\bmiddle\b/i.test(txt)) f.gap7 = 'MID';
    f.gap = f.gap7 ? (/^(LG|RG|MID)$/.test(f.gap7) ? 'in' : 'out') : null;
  }
  f.succ = successOf(f);
  f.epa = epaOf(f);
  f.expl = (kind === 'rush' && yds >= 12) || (kind === 'pass' && yds >= 16) ? 1 : 0;
  const am = Math.abs(ndMargin);
  f.garb = (f.q === 2 && am > 38) || (f.q === 3 && am > 28) || (f.q >= 4 && am > 22);
  return f;
}

function parseSpot(text, offAbbr) {
  const m = String(text || '').match(/at\s+(?:([A-Z&]{2,6})\s+)?(\d{1,2})\b/);
  if (!m) return null;
  const yd = Number(m[2]);
  if (!m[1] || yd === 50) return 50;
  return m[1] === offAbbr ? 100 - yd : yd;
}

function processSummary(s, g) {

    id: g.id, state: st.state || g.state, final: !!st.completed, detail: st.shortDetail || st.detail || g.detail || '',

    ndPoss: null, situation: '', lastPlay: '', plays: [], drives: [], box: { nd: {}, opp: {} }, players: { nd: {}, opp: {} },

  const bx = s.boxscore || {};

  (bx.players || []).forEach(t => {
    const side = String(t.team && t.team.id) === CFG.teamId ? 'nd' : 'opp';

    const plays = d.plays || [];
    const first = plays.find(p => p.start && p.start.yardsToEndzone != null && num(p.start.down)) || plays.find(p => p.start && p.start.yardsToEndzone != null);
    const sYTE = first ? num(first.start.yardsToEndzone) : null;
    const rz = plays.some(p => p.start && num(p.start.down) && num(p.start.yardsToEndzone) != null && num(p.start.yardsToEndzone) <= 20);

/* ---------- charts ---------- */
const measure = t => t.length * 6.2 + 4;
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

function lineChart(rows, ka, kb, fmt, opts = {}) {

/* radar fingerprint */
const AXES = [
  ['Success rate', 'sr', .30, .60, F.pct], ['EPA/play', 'epa', -.3, .45, F.s2], ['Explosive rate', 'expl', .03, .20, F.pct],
  ['3rd-down success', 't3', .2, .6, F.pct], ['Red-zone TD rate', 'rz', .3, .9, F.pct], ['Early-down yds/play', 'ed', 3, 8, F.f1]

function radar(scope) {

  if (!ok(A.sr)) return '<div class="empty">Needs play-by-play.</div>';
  const W = 640, H = 360, cx = W / 2, cy = H / 2 + 6, R = 120, n = AXES.length;
  const pt = (i, v) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(ang) * R * v, cy + Math.sin(ang) * R * v]; };
  const norm = (ax, v) => ok(v) ? Math.max(0.03, Math.min(1, (v - ax[2]) / (ax[3] - ax[2]))) : 0;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [.25, .5, .75, 1].forEach(r => { s += `<polygon points="${AXES.map((_, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="rgba(143,164,194,${r === 1 ? .3 : .12})"/>`; });
  AXES.forEach((ax, i) => {

/* pass map: depth x direction */

  const inv = side === 'opp';

  for (let i = 1; i < 6; i++) s += `<line x1="${fx}" x2="${fx + fw}" y1="${losY - i * 46}" y2="${losY - i * 46}" stroke="rgba(255,255,255,.07)"/>`;

    s += `<text x="${x0 + w / 2}" y="${y0 + 64}" text-anchor="middle">${dep} ${dir}</text>`;
    s += `<rect class="hit" x="${x0}" y="${y0}" width="${w}" height="${h - 8}" fill="transparent" data-tip="${dep} ${dir}|${c.length} attempts, ${F.f1(a.ypp)} yds/att|SR ${F.pct(a.sr)}, EPA ${F.s2(a.epa)}"/>`;

/* run gap chart */

/* ---------- playcalling profile ---------- */

}
function profileTable(scope) {

/* ---------- auto scouting report ---------- */
const lcFirst = s => /^[A-Z]{2}/.test(s) || /^\d/.test(s) ? s.replace('*', '') : s[0].toLowerCase() + s.slice(1).replace('*', '');

  const out = [], a = agg(nd), b = agg(op);
  out.push([a.sr >= b.sr ? 'good' : 'bad', `Notre Dame succeeds on <b>${F.pct(a.sr)}</b> of snaps against <b>${F.pct(b.sr)}</b> for its opponents, a <b>${F.pp(a.sr - b.sr)}</b> edge. EPA per play is <b>${F.s2(a.epa)}</b> to <b>${F.s2(b.epa)}</b>.`]);
  const ed = nd.filter(p => p.down <= 2), edo = op.filter(p => p.down <= 2);
  if (ed.length >= 15) {
    const r = ed.filter(isDB).length / ed.length, ro = edo.length ? edo.filter(isDB).length / edo.length : null;
    const pa = agg(ed.filter(isDB)), ru = agg(ed.filter(p => p.kind === 'rush'));
    out.push(['', `On early downs the Irish drop back <b>${F.pct0(r)}</b> of the time${ok(ro) ? ` (opponents: ${F.pct0(ro)})` : ''}. Early-down passes are worth <b>${F.s2(pa.epa)}</b> EPA against <b>${F.s2(ru.epa)}</b> for runs${ok(pa.epa) && ok(ru.epa) && pa.epa - ru.epa > .12 ? ', which argues for throwing more on 1st and 2nd down' : ''}.`]);
  }
  const cs = catStats(scope).filter(r => r.a.n >= 12 && !/Outcomes|Overview/.test(r.grp));
  if (cs.length >= 3) {
    const best = cs.slice().sort((x, y) => y.a.epa - x.a.epa)[0], worst = cs.slice().sort((x, y) => x.a.epa - y.a.epa)[0];
    out.push(['good', `Best situation: <b>${esc(lcFirst(best.label))}</b>, at <b>${F.s2(best.a.epa)}</b> EPA and <b>${F.pct0(best.a.sr)}</b> success over ${best.a.n} plays.`]);
    out.push(['bad', `Weakest situation: <b>${esc(lcFirst(worst.label))}</b>, at <b>${F.s2(worst.a.epa)}</b> EPA and <b>${F.pct0(worst.a.sr)}</b> success over ${worst.a.n} plays.`]);
  }

  const gaps = ['LE', 'LT', 'LG', 'MID', 'RG', 'RT', 'RE'].map(k => { const c = nd.filter(p => p.gap7 === k); return { k, n: c.length, sr: mean(c, p => p.succ) }; }).filter(g => g.n >= 8);
  if (gaps.length >= 2) { const g = gaps.sort((x, y) => y.sr - x.sr)[0]; const nm = { LE: 'left end', LT: 'left tackle', LG: 'left guard', MID: 'the middle', RG: 'right guard', RT: 'right tackle', RE: 'right end' }; out.push(['good', `The most reliable run lane is <b>${nm[g.k]}</b>: <b>${F.pct0(g.sr)}</b> success on ${g.n} carries.`]); }
  const rz = drivesFor(scope, 'nd').filter(d => d.rz);
  if (rz.length >= 4) out.push(['', `Red zone: <b>${rz.filter(d => d.td).length}</b> touchdowns on ${rz.length} trips (<b>${F.pct0(rz.filter(d => d.td).length / rz.length)}</b>).`]);
  const o3 = op.filter(p => p.down === 3);

/* ---------- players ---------- */
function playerAgg(side, scope) {
  const out = {};
  S.games.forEach(g => {
    const m = S.models[g.id]; if (!m) return; if (scope !== 'S' && scope !== g.id) return;
    Object.entries(m.players[side] || {}).forEach(([grp, ath]) => {
      const G = out[grp] = out[grp] || {};
      Object.entries(ath).forEach(([name, o]) => {
        const P = G[name] = G[name] || { name, gp: 0 }; P.gp++;
        Object.entries(o).forEach(([k, v]) => {
          if (k.includes('/')) { const [a, b] = k.split('/'), [x, y] = String(v).split('/'); P[a] = (P[a] || 0) + (num(x) || 0); P[b] = (P[b] || 0) + (num(y) || 0); }

    });
  });
  return out;
}

  const rows = Object.entries(by).map(([n, a]) => ({ n, c: a.length, sr: mean(a, p => p.succ), epa: mean(a, p => p.epa), ex: a.filter(p => p.expl).length, yds: sum(a, p => p.yds), wpa: a.reduce((x, p) => x + (p.wpa || 0), 0) })).sort((a, b) => b.c - a.c).slice(0, 12);
  if (!rows.length) return '<div class="empty">Needs play-by-play.</div>';
  let h = `<div class="tw"><table class="t"><thead><tr><th>Player</th><th>${kind === 'rush' ? 'Carries' : 'Targets'}</th><th>Yds</th><th>SR</th><th>EPA/${kind === 'rush' ? 'rush' : 'tgt'}</th><th class="hide-n">Explosive</th><th>WPA</th></tr></thead><tbody>`;
  rows.forEach(r => { h += `<tr><td>${esc(r.n)}</td><td>${r.c}</td><td>${r.yds}</td><td class="pf" style="${srColor(r.sr)}">${F.pct(r.sr)}</td><td class="pf" style="${epaColor(r.epa)}">${F.s2(r.epa)}</td><td class="hide-n">${r.ex}</td><td style="color:${r.wpa >= 0 ? C.green : C.violet}">${F.s1(r.wpa * 100)}%</td></tr>`; });
  return h + '</tbody></table></div>';
}

function renderNav() {

function renderTicker() {
  const done = S.games.filter(g => g.state === 'post');
  const W = done.filter(g => g.ndScore > g.oppScore).length, L = done.length - W;
  const a = agg(playsFor('S', 'nd')), b = agg(playsFor('S', 'opp')), ng = nextGame(), lg = liveGame();

  if (ok(a.sr)) items.push(['Off. success rate', F.pct(a.sr)], ['Off. EPA/play', F.s2(a.epa)], ['Def. success allowed', F.pct(b.sr)], ['Explosive rate', F.pct(a.expl)]);
  if (done.length) items.push(['Points per game', F.f1(sum(done, g => g.ndScore) / done.length)], ['Allowed per game', F.f1(sum(done, g => g.oppScore) / done.length)]);

function scoreboard(g, m) {
  const nd = { name: 'Notre Dame', logo: g.ndLogo, rank: g.ndRank, pts: m ? m.ndScore : g.ndScore };

  const tm = (t, isNd) => `<div class="tm">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}<span class="nm">${t.rank ? `<span class="rk">#${t.rank}</span> ` : ''}${esc(t.name)}${m && m.state === 'in' && possNd != null && possNd === isNd ? '<span class="poss" title="Possession"></span>' : ''}</span></div>`;
  return `<div class="score">${tm(away, away === nd)}<div><div style="display:flex;gap:.9rem;align-items:center;justify-content:center"><span class="pts ${away === nd ? 'nd' : ''}">${away.pts ?? 0}</span><span class="mid"><span class="clk">${esc((m && m.detail) || g.detail || '')}</span>${g.neutral ? 'neutral' : g.home ? 'home' : 'away'}</span><span class="pts ${home === nd ? 'nd' : ''}">${home.pts ?? 0}</span></div></div>${tm(home, home === nd)}</div>
  ${m && m.state === 'in' && m.situation ? `<div class="sit"><b>${esc(m.situation)}</b></div>` : ''}

}
function compareBlock(g, m) {

    ['Explosive rate', F.pct(nd.expl), F.pct(op.expl)], ['Plays', F.i(nd.n), F.i(op.n)],

}

  S.games.forEach(g => {
    const r = rows.find(x => x.g.id === g.id);
    const res = g.state === 'post' ? `${g.ndScore > g.oppScore ? 'W' : 'L'} ${g.ndScore}–${g.oppScore}` : g.state === 'in' ? `Live ${g.ndScore ?? 0}–${g.oppScore ?? 0}` : (g.tbd ? 'TBD' : new Date(g.date).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    const se = r && ok(r.nd_sr) && ok(r.op_sr) ? r.nd_sr - r.op_sr : null, ee = r && ok(r.nd_epa) && ok(r.op_epa) ? r.nd_epa - r.op_epa : null;
    h += `<tr><td>${g.home ? 'vs' : 'at'} ${g.opp.rank ? '#' + g.opp.rank + ' ' : ''}${esc(g.opp.name)}</td><td>${esc(fmtDate(g.date))}</td><td style="color:${g.state === 'post' ? (g.ndScore > g.oppScore ? C.green : C.violet) : 'var(--mute)'}">${esc(res)}</td>
      <td class="pf" style="${ok(se) ? heat(se / .12) : ''}">${ok(se) ? F.s1(se * 100) + ' pts' : '—'}</td><td class="pf" style="${ok(ee) ? heat(ee / .3) : ''}">${F.s2(ee)}</td>
      <td class="hide-n">${r ? F.f2(r.nd_ypp) : '—'}</td><td class="hide-n">${r ? F.f2(r.op_ypp) : '—'}</td></tr>`;
  });
  return h + '</tbody></table></div></section>';
}

function methodBlock() {
  return `<section class="pn"><h2>How the numbers work</h2><div class="method" style="margin-top:.6rem">
    <p><b>Success rate:</b> a play succeeds if it gains 50% of the needed yards on 1st down, 70% on 2nd, or all of it on 3rd and 4th. Touchdowns count as successes and turnovers as failures.</p>
    <p><b>EPA per play:</b> expected points before and after each snap from a simple down, distance and field-position model built into this page. Direction and rankings are reliable; magnitudes won't match outside sites exactly.</p>
    <p><b>Win probability added:</b> the change in ESPN's own win probability on each play, from Notre Dame's side.</p>
    <p><b>Explosive plays:</b> runs of 12+ yards and completions of 16+. <b>Garbage time</b> is a lead over 38 points in the 2nd quarter, 28 in the 3rd, or 22 in the 4th.</p>
    <p><b>Not available free:</b> personnel, motion, RPO, box counts, coverage and blitz data come from SIS hand charting. Pass depth, direction and run gap only exist where ESPN's play text includes them.</p>
  </div></section>`;
}
function footer() {
  return `<section class="pn"><div class="foot"><span>${S.source === 'live' ? 'Data: ESPN public API' : S.source === 'snapshot' ? `ESPN unreachable. Showing the ${SNAPSHOT.asOf} snapshot (box scores only).` : 'Connecting to ESPN'}${S.updated ? `, last checked ${esc(S.updated.toLocaleTimeString())}` : ''}</span>
    <span style="display:flex;flex-wrap:wrap;gap:.5rem"><button class="btn" data-act="refresh">Refresh now</button><button class="btn" data-act="log">Connection log</button><button class="btn" data-act="clear">Clear cache</button></span></div>
    <div class="log" id="log" hidden>${S.log.map(l => `<div><span class="${String(l.status) === '200' ? 'okc' : 'bad'}">${esc(l.status)}</span> ${l.ms} ms, ${(l.bytes / 1024).toFixed(0)} KB, ${esc(l.t.toLocaleTimeString())}<br>${esc(l.url)}</div>`).join('') || '<div>No requests yet.</div>'}</div></section>`;
}

function render() {
  renderNav();
  const v = { live: viewLive, season: viewSeason, play: viewPlay, gc: viewGC, players: viewPlayers, sched: viewSched }[S.tab]();
  const banner = S.source === 'snapshot' ? `<div class="banner"><b>Live feed unreachable.</b> Showing box-score totals from ${SNAPSHOT.asOf}. Play-by-play metrics fill in once ESPN responds; the connection log at the bottom shows why it failed.</div>` : '';
  const logOpen = $('#log') && !$('#log').hidden;
  $('#app').innerHTML = banner + v + footer();
  if (logOpen) $('#log').hidden = false;
  tickCountdown();
}
function tickCountdown() {
  const el = $('#countdown'); if (!el) return;
  const ms = new Date(el.dataset.t) - Date.now();
  if (ms <= 0) { el.textContent = 'Kickoff'; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  el.textContent = `${d ? d + 'd ' : ''}${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}
setInterval(tickCountdown, 1000);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-game],[data-metric],[data-scope],[data-ptab],[data-side],[data-act]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); history.replaceState(null, '', '#' + S.tab); }
  else if (t.dataset.game) { if (t.dataset.pre) return; S.scope = S.scope === t.dataset.game ? 'S' : t.dataset.game; render(); }
  else if (t.dataset.metric) { S.metric = t.dataset.metric; render(); }
  else if (t.dataset.scope) { S.scope = t.dataset.scope; render(); }
  else if (t.dataset.ptab) { S.playerTab = t.dataset.ptab; render(); }
  else if (t.dataset.side) { S.side = t.dataset.side; render(); }
  else if (t.dataset.act === 'refresh') refreshAll(true);
  else if (t.dataset.act === 'alerts') toggleAlerts();
  else if (t.dataset.act === 'log') { const l = $('#log'); l.hidden = !l.hidden; }
  else if (t.dataset.act === 'clear') { try { Object.keys(localStorage).filter(k => k.startsWith('nd26-v')).forEach(k => localStorage.removeItem(k)); } catch (err) {} S.models = {}; refreshAll(true); }
});
document.addEventListener('change', e => { if (e.target.id === 'garb') { S.noGarbage = e.target.checked; render(); } });
let tipEl = null;
function showTip(e) {
  const hit = e.target.closest && e.target.closest('.hit');
  const box = hit && hit.closest('.cb');
  if (!hit || !box) { if (tipEl) tipEl.style.opacity = 0; return; }
  if (!tipEl || tipEl.parentNode !== box) { tipEl = document.createElement('div'); tipEl.className = 'tip'; box.appendChild(tipEl); }
  const [h, ...lines] = hit.getAttribute('data-tip').split('|');
  tipEl.innerHTML = `<div class="h">${esc(h)}</div>${lines.map(l => `<div>${esc(l)}</div>`).join('')}`;
  const br = box.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
  const x = pt.clientX - br.left, y = pt.clientY - br.top;
  tipEl.style.opacity = 1;
  tipEl.style.left = Math.max(4, Math.min(br.width - tipEl.offsetWidth - 4, x - tipEl.offsetWidth / 2)) + 'px';
  tipEl.style.top = Math.max(0, y - tipEl.offsetHeight - 14) + 'px';
}
document.addEventListener('mousemove', showTip);
document.addEventListener('touchstart', showTip, { passive: true });

/* ---------- boot ---------- */
(function boot() {
  const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) S.tab = h;
  S.games = snapshotGames(); S.source = 'init';
  render();
  refreshAll().then(() => { if (!location.hash && !liveGame()) { S.tab = 'season'; render(); } });
})();
</script>
</body>
</html>
